[project]
description = "Generic utilities and templates library."
name = "synodic-template-library"

license = { text = "MIT" }

authors = [{ name = "Synodic Software", email = "contact@synodic.software" }]

readme = "README.md"

dynamic = ["version"]

dependencies = []
requires-python = ">=3.13"

[project.urls]
homepage = "https://github.com/Synodic-Software/Synodic-Template-Library"
repository = "https://github.com/Synodic-Software/Synodic-Template-Library"

[tool.cppython]
dependencies = ['honesty>=0.0.0.dev1']

[tool.cppython.generators.cmake]
preset_file = "tool/cmake/platform/common/CMakePresets.json"
configuration_name = "default"

[tool.cppython.providers.conan]
remotes = []

[tool.pdm.scripts]
build = { shell = "cppython build" }
test = { shell = "cppython test" }

[dependency-groups]
build = [
    "cppython[cmake,conan,git]>=0.9.7",
]
lint = [
    "ruff>=0.12.9",
    "pyrefly>=0.28.1",
    "isort>=6.0.1",
]
test = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]

[build-system]
build-backend = "pdm.backend"
requires = ["pdm.backend"]
