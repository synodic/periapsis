[project]
description = "Utility library."
name = "synodic-template-library"

license = {text = "MIT"}

authors = [
  {name = "Synodic Software", email = "contact@synodic.software"},
]

readme = "README.md"

dynamic = ["version"]

dependencies = []
requires-python = ">=3.13"

[project.urls]
homepage = "https://github.com/Synodic-Software/Synodic-Template-Library"
repository = "https://github.com/Synodic-Software/Synodic-Template-Library"

[tool.cppython]

[tool.cppython.provider.conan]
dependencies = [
  'honesty>=0.0.0.dev1',
]

[tool.pdm.dev-dependencies]
dev = [
  "cppython[pdm,conan,cmake]>=0.0.0.dev1",
]
lint = [
  "ruff>=0.8.1",
  "mypy>=1.13",
  "isort>=5.13.2",
]
test = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "pytest-mock>=3.14.0",
]

[tool.pdm.options]
update = ["--update-all"]

[tool.pdm.scripts]
build = {shell = "cppython build"}
test = {shell = "cppython test"}

[build-system]
build-backend = "pdm.backend"
requires = ["pdm.backend"]
